<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Sabor Estelar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <!-- Login Section -->
  <div id="loginSection" class="admin-container active">
    <div class="admin-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo">Sabor<span>Estelar</span></div>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Panel de Control GitHub</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>GitHub Personal Access Token</label>
          <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" required>
          <small style="color:var(--text-secondary); display:block; margin-top:0.5rem;">Tu token se guarda de forma segura solo en tu navegador local.</small>
        </div>
        <button type="submit" class="admin-btn full-width">Conectar con GitHub</button>
        <p id="loginError" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="admin-container">
    <div class="admin-card wide">
      <div class="dashboard-header">
        <h2>Añadir Nueva Receta</h2>
        <button id="logoutBtn" class="admin-btn outline">Desconectar</button>
      </div>

      <p style="margin-bottom: 2rem; color: var(--text-secondary);">
        Al guardar, la receta y la foto se subirán directamente a tu repositorio <strong>roberben/recetas-web</strong>. ¡Coste 0 garantizado!
      </p>

      <form id="recipeForm" class="recipe-form">
        <div class="form-row">
          <div class="form-group">
            <label>Título de la receta</label>
            <input type="text" id="recipeTitle" required>
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="recipeCategory" required>
              <option value="desayuno">Desayuno</option>
              <option value="plato principal">Plato Principal</option>
              <option value="postre">Postre</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tiempo de preparación (ej. '40 min')</label>
            <input type="text" id="recipeTime" required>
          </div>
          <div class="form-group">
            <label>Dificultad</label>
            <select id="recipeDifficulty" required>
              <option value="Fácil">Fácil</option>
              <option value="Media">Media</option>
              <option value="Difícil">Difícil</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Descripción corta</label>
          <input type="text" id="recipeDescription" required>
        </div>

        <div class="form-group">
          <label>Imagen de la receta</label>
          <input type="file" id="recipeImageFile" accept="image/*" style="padding: 0; background: transparent; border: none; margin-bottom: 0.5rem;">
          <small style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">O pega una URL de internet en su lugar:</small>
          <input type="text" id="recipeImageUrl" placeholder="https://ejemplo.com/foto.jpg">
        </div>

        <div class="form-group">
          <label>Ingredientes (Uno por línea)</label>
          <textarea id="recipeIngredients" rows="5" required placeholder="1 taza de harina&#10;2 huevos..."></textarea>
        </div>

        <div class="form-group">
          <label>Instrucciones (Una por línea)</label>
          <textarea id="recipeInstructions" rows="5" required placeholder="Mezcla los ingredientes...&#10;Hornea a 180 grados..."></textarea>
        </div>

        <button type="submit" id="saveRecipeBtn" class="admin-btn full-width">Publicar en GitHub</button>
        <p id="formFeedback" class="success-msg"></p>
      </form>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
